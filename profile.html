<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaProfile</title><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font-family:Inter,system-ui,Arial}.bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:#08080b center/cover no-repeat;position:relative;overflow:hidden}.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.shade{position:absolute;inset:0;background:#0005}.card{position:relative;z-index:2;width:min(570px,95%);padding:30px;text-align:center;background:#0f0f15c2;border:1px solid #ffffff18;border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 25px 100px #000}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#765cf5;margin:auto;border:2px solid #ffffff20}.name{font-size:30px;font-weight:900;margin:12px 0 5px}.bio{color:#aaa;line-height:1.5;white-space:pre-wrap}.links{display:grid;gap:9px;margin-top:18px}.links a{padding:13px;color:#fff;text-decoration:none;background:#ffffff08;border:1px solid #ffffff0d;border-radius:10px}.meta{font-size:11px;color:#777;margin-top:16px}.music{margin-top:17px;padding:12px 14px;border-radius:12px;background:#ffffff09;border:1px solid #ffffff10;text-align:left}.music small{display:block;color:#888;margin-top:3px}.music button{margin-top:9px;padding:7px 10px;border:0;border-radius:8px;background:#765cf5;color:#fff}.enter{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#050507 center/cover no-repeat;cursor:pointer}.enterbox{text-align:center}.enterbox b{font-size:22px}.enterbox small{display:block;color:#999;margin-top:7px}.top{position:fixed;top:16px;right:16px;z-index:30;display:flex;gap:8px}.btn{padding:9px 12px;border:1px solid #ffffff14;background:#111118dd;color:#fff;border-radius:10px;text-decoration:none;backdrop-filter:blur(10px)}.primary{background:#765cf5;border-color:#765cf5}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:31;background:#111118ee;border:1px solid #ffffff14;padding:9px 12px;border-radius:9px;color:#aaa;display:none}</style></head><body><div class="top"><a class="btn" href="index.html">NovaProfile</a><a class="btn primary" href="editor.html">Eigenes Profil</a></div><main class="bg" id="bg"><video id="bgVideo" muted autoplay loop playsinline></video><div class="shade"></div><section class="card"><img class="avatar" id="avatar" alt="Avatar"><div class="name" id="name">Profil wird geladen…</div><div class="bio" id="bio"></div><div class="links" id="links"></div><div class="music" id="music" style="display:none"><b id="song"></b><small id="artist"></small><button id="play">▶ Preview abspielen</button></div><div class="meta" id="meta"></div></section></main><div class="enter" id="enter"><div class="enterbox"><b id="enterText">click to enter...</b><small id="enterSub">welcome to my profile</small></div></div><div class="status" id="status"></div><script>
const $=id=>document.getElementById(id);let data=null,preview='';
function status(t){$('status').textContent=t;$('status').style.display='block';setTimeout(()=>$('status').style.display='none',2600)}
async function init(){const u=(new URLSearchParams(location.search).get('u')||'yourname').toLowerCase();$('name').textContent='@'+u;try{if(!window.NOVA_SUPABASE_URL||window.NOVA_SUPABASE_URL.includes('DEINE_')){status('Cloud noch nicht eingerichtet.');return}const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const sb=m.createClient(window.NOVA_SUPABASE_URL,window.NOVA_SUPABASE_ANON_KEY);const r=await sb.from('profiles').select('*').eq('username',u).maybeSingle();if(r.error)throw r.error;if(!r.data){$('name').textContent='@'+u;$('bio').textContent='Dieses Profil wurde noch nicht erstellt.';return}data=r.data;render();sb.rpc('increment_profile_views',{p_username:u});}catch(e){$('bio').textContent='Profil konnte nicht geladen werden.';console.error(e)}}
function render(){document.title=(data.name||data.username)+' — NovaProfile';$('name').textContent=data.name||('@'+data.username);$('bio').textContent=data.bio||'';$('meta').textContent='@'+data.username+' · '+(data.views||0)+' Aufrufe';$('avatar').src=data.avatar||'';document.documentElement.style.setProperty('--accent',data.accent||'#765cf5');$('links').innerHTML=(data.links||[]).map(x=>`<a href="${String(x.u||'#').replaceAll('"','&quot;')}" target="_blank" rel="noopener">${String(x.n||'Link').replaceAll('<','&lt;')}</a>`).join('');$('bg').style.backgroundColor=data.bg_color||'#08080b';if(data.bg_mode==='image'&&data.bg_url)$('bg').style.backgroundImage=`url("${data.bg_url.replaceAll('"','')}" )`;if(data.bg_mode==='video'&&data.video_url){$('bgVideo').src=data.video_url;$('bgVideo').style.display='block'}$('enterText').textContent=data.enter_text||'click to enter...';$('enterSub').textContent=data.enter_sub||'welcome to my profile';$('enter').style.backgroundImage=data.bg_url?`url("${data.bg_url.replaceAll('"','')}")`:'';$('card').style.background=`rgba(15,15,21,${Math.max(.1,Math.min(1,(data.opacity||76)/100))})`;$('card').style.borderRadius=(data.radius||24)+'px';$('card').style.backdropFilter=data.glass===false?'none':`blur(${data.blur||18}px)`;if(data.glow)$('card').style.boxShadow=`0 25px 100px #000,0 0 70px ${(data.accent||'#765cf5')}45`;if(data.song||data.artist){$('music').style.display='block';$('song').textContent=data.song||'Untitled';$('artist').textContent=data.artist||'';searchPreview(data.song||'',data.artist||'')}}
async function searchPreview(s,a){try{const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(s+' '+a)+'&entity=song&limit=5&country=DE');const j=await r.json();const x=(j.results||[]).find(z=>z.previewUrl);if(x)preview=x.previewUrl}catch(e){}}
$('play').onclick=()=>{if(!preview){status('Für diesen Titel ist keine Preview verfügbar.');return}const a=new Audio(preview);a.volume=Math.max(0,Math.min(1,(data.volume??70)/100));a.play().then(()=>status('Preview läuft ✓')).catch(()=>status('Wiedergabe erneut anklicken.'))};
$('enter').onclick=()=>{$('enter').style.opacity='0';$('enter').style.pointerEvents='none';setTimeout(()=>$('enter').remove(),500)};init();
</script></body></html>
